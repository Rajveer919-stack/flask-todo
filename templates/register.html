<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 350px; margin: 60px auto; padding: 0 15px; }
    input { display: block; width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
    button { padding: 8px 14px; cursor: pointer; }
    .msg { color: #b00020; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Register</h1>

  {% for message in get_flashed_messages() %}
    <p class="msg">{{ message }}</p>
  {% endfor %}

  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password (min 6 characters)" required>
    <button type="submit">Create Account</button>
  </form>

  <p>Pehle se account hai? <a href="/login">Login karo</a></p>
</body>
</html>
